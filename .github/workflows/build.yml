name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload OFX bundle
        uses: actions/upload-artifact@v4
        with:
          name: RimellAnamorphic-${{ matrix.os }}
          path: build/RimellAnamorphic.ofx.bundle
          if-no-files-found: error
